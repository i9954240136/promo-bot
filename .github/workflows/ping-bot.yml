name: Ping Bot Every 10 Minutes

on:
  schedule:
    - cron: '*/10 * * * *'  # Каждые 10 минут
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping bot webhook
        run: |
          curl -X POST https://promo-bot-ex86.onrender.com/webhook \
            -H "Content-Type: application/json" \
            -d '{"test":"ping"}' || echo "Ping failed"
