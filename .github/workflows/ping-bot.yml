name: Ping Bot Every 5 Minutes

on:
  schedule:
    # Запускается каждые 5 минут
    - cron: '*/5 * * * *'
  workflow_dispatch:  # Позволяет запустить вручную

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping bot health endpoint
        run: |
          curl -X GET https://promo-bot-ex86.onrender.com/health || echo "Ping failed"
