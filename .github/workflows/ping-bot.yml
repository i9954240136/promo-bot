name: Ping Bot Every Minute

on:
  schedule:
    # Запускается каждую минуту
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping bot health endpoint
        run: |
          curl -X GET https://promo-bot-ex86.onrender.com/health || echo "Ping failed"
